on:
  workflow_call:
    inputs:
      # Versioning
      is-release-build:
        type: boolean
        description: Whether the version is a prerelease or full release
        required: false

env:
  IS_RELEASE_BUILD: ${{ inputs.is-release-build }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10'      
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: nuke
        path: build/bin/Debug/publish/
    - uses: actions/download-artifact@v8
      with:
        path: dist/.organize
    - run: dotnet build/bin/Debug/publish/_build.dll Node
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: nodetars
        path: |
          lib/node/*/*.tgz
  node-test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
        # required: 'lts/*' and '*' (newest stable release, a semver range never resolves to pre-releases)
        # informational: 'latest' (newest release including pre-releases), failures are reported as warning
        node: ["lts/*", "*", "latest"]
    runs-on: ${{ matrix.runs-on }}
    needs: [node]
    steps:
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10'      
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: nuke
        path: build/bin/Debug/publish/
    - uses: actions/download-artifact@v8
      with:
        name: nodetars
        path: dist/.organize/node
    - id: setup-node
      uses: actions/setup-node@v6
      continue-on-error: ${{ matrix.node == 'latest' }}
      with:
        node-version:  ${{ matrix.node }}
    - id: node-test
      if: steps.setup-node.outcome == 'success'
      continue-on-error: ${{ matrix.node == 'latest' }}
      run: dotnet build/bin/Debug/publish/_build.dll NodeTest
      shell: bash
    - if: steps.setup-node.outcome == 'failure' || steps.node-test.outcome == 'failure'
      run: echo "::warning title=Node ${{ matrix.node }}::Node tests failed on Node '${{ matrix.node }}' (not required)"
      shell: bash
    - id: sanitize-node-version
      if: always()
      run:  echo "NODE_VERSION=${{ matrix.node == '*' && 'current' || matrix.node }}" | sed 's/[*\/]//g' >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: nodetest-${{ matrix.runs-on }}-${{ steps.sanitize-node-version.outputs.NODE_VERSION }}
        path: |
          test/test-outputs/**/*.*
