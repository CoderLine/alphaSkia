on:
  workflow_call:
    inputs:
      # Versioning
      is-release-build:
        type: boolean
        description: Whether the version is a prerelease or full release
        required: false

      # Build Settings
      runs-on:
        type: string
        description: The runner image to run the workflow on.
        required: true
      target-os:
        type: string
        description: The target OS for which to build the libraries.
        required: true
      architectures:
        type: string
        description: The JSON encoded array of CPU architectures to build the libraries for.
        required: true
      variants:
        type: string
        description: The JSON encoded array of variants to build the libraries for.
        required: true

env:
  IS_RELEASE_BUILD: ${{ inputs.is-release-build }}

jobs:
  native:
    runs-on: ${{ inputs.runs-on }}
    name: Native ${{ inputs.target-os }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJson( inputs.architectures ) }}
    env:
      # Windows builds use clang-cl, which sccache supports; the other platforms use ccache
      ALPHASKIA_CC_WRAPPER: ${{ inputs.target-os == 'windows' && 'sccache' || 'ccache' }}
      CCACHE_DIR: ${{ github.workspace }}/.compiler-cache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 1G
      SCCACHE_DIR: ${{ github.workspace }}/.compiler-cache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10'
      - name: Cloning Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetching Pre-Built Nuke
        uses: actions/download-artifact@v8
        with:
          name: nuke
          path: build/bin/Debug/publish/

      # on Linux runners the build installs ccache with its other packages
      - name: Install ccache
        if: ${{ runner.os == 'macOS' }}
        run: brew install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
      - name: Install sccache
        if: ${{ runner.os == 'Windows' }}
        run: choco install sccache --yes --no-progress

      # The compiler cache identifies objects by their preprocessed sources and compiler flags, it needs no hand
      # maintained key. Every run stores a new entry, the newest one of the target is restored.
      - name: Restore Compiler Cache
        uses: actions/cache/restore@v5
        with:
          path: .compiler-cache
          key: compiler-cache-${{ inputs.target-os }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: compiler-cache-${{ inputs.target-os }}-${{ matrix.architecture }}-

      - name: Install Latest Stable Android NDK
        if: ${{ inputs.target-os == 'android' }}
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          ALL_NDKS=$("$SDKMANAGER" --list --channel=0 2>/dev/null | grep -E "^\s+ndk;" | awk '{print $1}' | sort -V)
          LATEST_MAJOR=$(echo "$ALL_NDKS" | awk -F'[.;]' '{print $2}' | sort -Vu | tail -1)
          STABLE_NDK=$(echo "$ALL_NDKS" | awk -F'[.;]' -v max="$LATEST_MAJOR" '$2+0 < max+0' | sort -V | tail -1)
          echo "Installing NDK: $STABLE_NDK"
          "$SDKMANAGER" "$STABLE_NDK"
          NDK_VERSION="${STABLE_NDK#ndk;}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Compiling LibSkia and LibAlphaSkia
        run: dotnet build/bin/Debug/publish/_build.dll LibSkia LibAlphaSkia LibAlphaSkiaTest CheckAndroidAlignment --target-os ${{ inputs.target-os }} --architecture ${{ matrix.architecture }} --variants ${{ join(fromJson(inputs.variants), ' ') }}
        shell: bash

      - name: Compiler Cache Statistics
        if: ${{ always() }}
        continue-on-error: true
        run: $ALPHASKIA_CC_WRAPPER ${{ inputs.target-os == 'windows' && '--show-stats' || '--show-stats --verbose' }}
        shell: bash

      - name: Save Compiler Cache
        uses: actions/cache/save@v5
        if: ${{ always() }}
        with:
          path: .compiler-cache
          key: compiler-cache-${{ inputs.target-os }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Uploading LibAlphaSkia (shared)
        uses: actions/upload-artifact@v7
        if: ${{ contains(fromJson(inputs.variants), 'shared') }}
        with:
          name: libalphaskia-${{ inputs.target-os }}-${{ matrix.architecture }}-shared
          path: artifacts/shared
          if-no-files-found: error

      - name: Uploading LibAlphaSkia (jni)
        uses: actions/upload-artifact@v7
        if: ${{ contains(fromJson(inputs.variants), 'jni') }}
        with:
          name: libalphaskia-${{ inputs.target-os }}-${{ matrix.architecture }}-jni
          path: artifacts/jni
          if-no-files-found: error

      - name: Uploading LibAlphaSkia (node)
        uses: actions/upload-artifact@v7
        if: ${{ contains(fromJson(inputs.variants), 'node') }}
        with:
          name: libalphaskia-${{ inputs.target-os }}-${{ matrix.architecture }}-node
          path: artifacts/node
          if-no-files-found: error

      - name: Uploading LibAlphaSkiaTest to Artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: libalphaskiatest-${{ inputs.target-os }}-${{ matrix.architecture }}
          if-no-files-found: ignore
          path: |
            dist/libalphaskiatest-*/
            test/test-outputs/
